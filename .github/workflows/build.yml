name: Build ImmortalWrt 23.05 for FW28-V21 (Auto APN 4G)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev git python3 unzip wget gawk flex bison libssl-dev zlib1g-dev libelf-dev subversion libncursesw5-dev libreadline-dev libtool automake autoconf pkg-config ccache

      - name: 拉取 ImmortalWrt 源码
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: openwrt-23.05
          fetch-depth: 1

      - name: 创建 FW28-V21 公版设备树 (DTS)
        run: |
          cat > target/linux/ramips/dts/mt7628an_fw28-v21.dts <<'EOF'
          // SPDX-License-Identifier: GPL-2.0-or-later OR MIT

          /dts-v1/;
          #include "mt7628an.dtsi"

          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/input/input.h>
          #include <dt-bindings/leds/common.h>

          / {
          	compatible = "fw28,v21", "mediatek,mt7628an-soc";
          	model = "FW28-V21 (Generic MT7628 with 4G)";

          	chosen {
          		bootargs = "console=ttyS0,57600";
          	};

          	memory@0 {
          		device_type = "memory";
          		reg = <0x0 0x4000000>; /* 假设 64MB */
          	};

          	keys {
          		compatible = "gpio-keys";

          		reset {
          			label = "reset";
          			gpios = <&gpio 38 GPIO_ACTIVE_LOW>;
          			linux,code = <KEY_RESTART>;
          		};
          	};

          	leds {
          		compatible = "gpio-leds";

          		power {
          			label = "green:power";
          			gpios = <&gpio 44 GPIO_ACTIVE_LOW>;
          		};
          	};
          };

          &ethernet {
          	nvmem-cells = <&macaddr_factory_4>;
          	nvmem-cell-names = "mac-address";
          };

          &esw {
          	mediatek,portmap = <0x2f>;
          };

          &wmac {
          	status = "okay";
          	nvmem-cells = <&eeprom_factory_0>;
          	nvmem-cell-names = "eeprom";
          	mediatek,mtd-eeprom = <&factory 0x0>;
          };

          &pcie {
          	status = "okay";
          };

          &pcie0 {
          	wifi@0,0 {
          		compatible = "mediatek,mt76";
          		reg = <0x0000 0 0 0 0>;
          	};
          };

          &spi0 {
          	status = "okay";

          	flash@0 {
          		compatible = "jedec,spi-nor";
          		reg = <0>;
          		spi-max-frequency = <40000000>;

          		partitions {
          			compatible = "fixed-partitions";
          			#address-cells = <1>;
          			#size-cells = <1>;

          			partition@0 {
          				label = "u-boot";
          				reg = <0x0 0x30000>;
          				read-only;
          			};

          			partition@30000 {
          				label = "u-boot-env";
          				reg = <0x30000 0x10000>;
          				read-only;
          			};

          			partition@40000 {
          				label = "factory";
          				reg = <0x40000 0x10000>;
          				read-only;

          				compatible = "nvmem-cells";
          				#address-cells = <1>;
          				#size-cells = <1>;

          				eeprom_factory_0: eeprom@0 {
          					reg = <0x0 0x400>;
          				};

          				macaddr_factory_4: macaddr@4 {
          					reg = <0x4 0x6>;
          				};
          			};

          			partition@50000 {
          				label = "firmware";
          				reg = <0x50000 0xfb0000>;
          				compatible = "denx,uimage";
          			};
          		};
          	};
          };

          &uart1 {
          	status = "okay";
          };
          EOF

      - name: 添加设备镜像生成规则到 mt76x8.mk
        run: |
          cat >> target/linux/ramips/image/mt76x8.mk <<'EOF'

          define Device/fw28-v21
            IMAGE_SIZE := 16000k
            DEVICE_VENDOR := FW28
            DEVICE_MODEL := V21
            DEVICE_PACKAGES := kmod-usb2 kmod-usb-ohci kmod-usb-serial-option kmod-usb-net-qmi-wwan modemmanager luci-proto-modemmanager usb-modeswitch
            SUPPORTED_DEVICES += fw28,v21
          endef
          TARGET_DEVICES += fw28-v21
          EOF

      - name: 创建内置配置文件 (自动APN脚本 + 预配置网络)
        run: |
          mkdir -p files/etc/hotplug.d/iface
          mkdir -p files/etc/config

          # 1. 自动APN识别脚本
          cat > files/etc/hotplug.d/iface/99-auto-apn <<'EOF'
          #!/bin/sh
          [ "$ACTION" = "ifup" ] && [ "$INTERFACE" = "4g" ] || exit 0

          logger -t "auto-apn" "4G接口已启动，开始自动检测APN..."

          # 等待ModemManager完全初始化
          sleep 5

          # 获取第一个调制解调器编号
          MODEM_NUM=$(mmcli -L 2>/dev/null | grep -oE '[0-9]+' | head -1)
          if [ -z "$MODEM_NUM" ]; then
              logger -t "auto-apn" "未找到调制解调器，稍后重试"
              exit 1
          fi

          # 获取IMSI
          IMSI=$(mmcli -m "$MODEM_NUM" --3gpp-get-imei 2>/dev/null | grep -oE "imsi: '[0-9]+'" | cut -d"'" -f2)
          if [ -z "$IMSI" ]; then
              logger -t "auto-apn" "无法获取IMSI，可能SIM卡未就绪"
              exit 1
          fi

          logger -t "auto-apn" "检测到SIM卡，IMSI: $IMSI"

          # 根据MCC+MNC匹配APN
          MCCMNC=$(echo "$IMSI" | cut -c1-5)
          case "$MCCMNC" in
              46000|46002|46004|46007|46008) APN="cmnet" ;;  # 中国移动
              46001|46006|46009)             APN="3gnet" ;; # 中国联通
              46003|46005|46011)             APN="ctnet" ;; # 中国电信
              *)                             APN=""        ;; # 未知运营商留空，让网络下发
          esac

          CURRENT_APN=$(uci -q get network.4g.apn)
          if [ -n "$APN" ] && [ "$CURRENT_APN" != "$APN" ]; then
              logger -t "auto-apn" "检测到运营商 $MCCMNC，自动设置APN为 '$APN'"
              uci set network.4g.apn="$APN"
              uci commit network
              /etc/init.d/network reload
          elif [ -z "$APN" ]; then
              logger -t "auto-apn" "未知运营商，保持APN为空，将由网络侧自动下发"
          else
              logger -t "auto-apn" "APN已是 '$APN'，无需更改"
          fi
          EOF

          chmod +x files/etc/hotplug.d/iface/99-auto-apn

          # 2. 预配置一个名为4G的ModemManager接口（APN留空，适配物联网卡）
          cat > files/etc/config/network <<'EOF'
          config interface 'loopback'
          	option device 'lo'
          	option proto 'static'
          	option ipaddr '127.0.0.1'
          	option netmask '255.0.0.0'

          config globals 'globals'
          	option ula_prefix 'fd00::/48'

          config device
          	option name 'br-lan'
          	option type 'bridge'
          	list ports 'eth0.1'

          config interface 'lan'
          	option device 'br-lan'
          	option proto 'static'
          	option ipaddr '192.168.1.1'
          	option netmask '255.255.255.0'
          	option ip6assign '60'

          config device
          	option name 'eth0.2'
          	option type '8021q'
          	option ifname 'eth0'
          	option vid '2'

          config interface 'wan'
          	option device 'eth0.2'
          	option proto 'dhcp'

          # 预置4G接口（ModemManager模式，APN留空）
          config interface '4g'
          	option proto 'modemmanager'
          	option device '/sys/class/net/wwan0'
          	option apn ''
          	option pincode ''
          	option username ''
          	option password ''
          	option autoconnect '1'
          	option ipv6 'auto'

          # 将4G接口加入wan防火墙区域，使其能正常上网
          config rule
          	option name 'Allow-4G-Input'
          	option src '4g'
          	option target 'ACCEPT'

          config rule
          	option name 'Allow-4G-Forward'
          	option src '4g'
          	option dest '*'
          	option target 'ACCEPT'
          EOF

      - name: 写入编译配置 (.config)
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_fw28-v21=y
          CONFIG_TARGET_OPTIMIZATION="-Os -pipe -march=24kc -mtune=24kc"
          CONFIG_SMALL_FLASH=y
          CONFIG_USE_MKLIBS=y
          CONFIG_STRIP_KERNEL_EXPORTS=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          # CONFIG_TARGET_ROOTFS_JFFS2 is not set
          CONFIG_TARGET_KERNEL_PARTSIZE=2048
          CONFIG_TARGET_ROOTFS_PARTSIZE=9728

          # WiFi驱动
          CONFIG_PACKAGE_kmod-mt76x8=y

          # USB 基础
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ehci=y

          # 4G模块驱动
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_usb-modeswitch-data=y

          # 使用ModemManager进行拨号管理（自动APN的核心）
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y
          # 不选uqmi，避免冲突
          # CONFIG_PACKAGE_uqmi is not set

          # 网络基础
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_firewall=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y

          # LuCI界面 + 中文
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-network-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-system-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          # Web服务器和SSH
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_dropbear=y

          # 禁用不需要的功能（节省空间）
          # CONFIG_IPV6 is not set
          # CONFIG_PACKAGE_odhcpd-ipv6only is not set
          # CONFIG_PACKAGE_kmod-ip6tables is not set
          # CONFIG_PACKAGE_kmod-usb-storage is not set
          # CONFIG_PACKAGE_kmod-fs-vfat is not set
          # CONFIG_PACKAGE_kmod-pcie is not set
          # CONFIG_PACKAGE_kmod-pcie-mediatek is not set
          EOF

      - name: 生成完整配置
        run: make defconfig

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 下载所有依赖包
        run: make download -j$(nproc)

      - name: 开始编译固件
        run: make -j$(nproc) V=s

      - name: 上传编译好的固件
        uses: actions/upload-artifact@v4
        with:
          name: FW28-V21-AutoAPN-4G
          path: bin/targets/ramips/mt76x8/*sysupgrade.bin
          if-no-files-found: error
