name: Build ImmortalWrt 23.05 MT7628 4G

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 增加 Swap 防止内存溢出
      - name: 增加 Swap 空间
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      # 2. 拉取源码
      - name: 拉取 ImmortalWrt 源码
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: openwrt-23.05
          fetch-depth: 1

      # 3. 安装依赖
      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev git python3 unzip wget gawk flex bison libssl-dev zlib1g-dev libelf-dev

      # 4. 更新 feeds
      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. 写入配置 (这里是最容易出错的地方，请严格按此格式)
      - name: 写入自定义配置 (.config)
        run: |
          cat > .config <<EOF
CONFIG_TARGET_ramips=y
CONFIG_TARGET_ramips_mt7628=y
CONFIG_TARGET_ramips_mt7628_DEVICE_generic=y
CONFIG_TARGET_OPTIMIZATION="-Os -pipe -march=24kc -mtune=24kc"
CONFIG_SMALL_FLASH=y
CONFIG_TARGET_ROOTFS_SQUASHFS=y
CONFIG_TARGET_ROOTFS_JFFS2=n
CONFIG_TARGET_KERNEL_PARTSIZE=4
CONFIG_TARGET_ROOTFS_PARTSIZE=12

# 修复 dnsmasq 冲突
CONFIG_PACKAGE_dnsmasq=n
CONFIG_PACKAGE_dnsmasq-full=y
CONFIG_PACKAGE_dnsmasq_full_dhcp=y
CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
CONFIG_PACKAGE_dnsmasq_full_dnssec=y
CONFIG_PACKAGE_dnsmasq_full_ipset=y
CONFIG_PACKAGE_dnsmasq_full_noid=y
CONFIG_PACKAGE_dnsmasq_full_tftp=y

# WiFi & 4G 驱动
CONFIG_PACKAGE_kmod-mt76=y
CONFIG_PACKAGE_kmod-mt76x8=y
CONFIG_PACKAGE_kmod-usb3=n
CONFIG_PACKAGE_kmod-usb2=y
CONFIG_PACKAGE_kmod-usb-ohci=y
CONFIG_PACKAGE_kmod-usb-serial=y
CONFIG_PACKAGE_kmod-usb-serial-option=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
CONFIG_PACKAGE_kmod-usb-net-cdc-wdm=y
CONFIG_PACKAGE_usb-modeswitch=y

# 拨号工具
CONFIG_PACKAGE_comgt=y
CONFIG_PACKAGE_uqmi=y
CONFIG_PACKAGE_umbim=y

# LuCI
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
CONFIG_PACKAGE_luci-i18n-system-zh-cn=y
CONFIG_PACKAGE_luci-i18n-network-zh-cn=y
CONFIG_PACKAGE_luci-proto-ppp=y
CONFIG_PACKAGE_luci-proto-qmi=y
CONFIG_PACKAGE_luci-proto-mbim=y

# 移除不必要的包以节省空间
CONFIG_PACKAGE_ipv6helper=n
CONFIG_PACKAGE_odhcp6c=n
CONFIG_PACKAGE_urngd=n
EOF
          # 注意：上面的 EOF 必须顶格写，前面不能有空格

      # 6. 生成配置
      - name: 生成配置并下载
        run: |
          make defconfig
          make download -j$(nproc)

      # 7. 开始编译
      - name: 开始编译
        run: |
          make -j$(nproc) V=s

      # 8. 上传固件
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: MT7628-4G-Final
          path: bin/targets/ramips/mt7628/*sysupgrade.bin
