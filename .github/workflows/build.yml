name: Build ImmortalWrt

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build OpenWrt Firmware
        uses: P3TERX/Actions-OpenWrt@main
        with:
          config-file: .config
